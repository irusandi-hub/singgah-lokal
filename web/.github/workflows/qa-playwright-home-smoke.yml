name: qa
run-name: Playwright home smoke (manual)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target site base URL (no trailing slash)"
        required: true
        type: string

jobs:
  playwright-home-smoke:
    name: Playwright home smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .playwright-cache
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright browsers
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-cache
        run: npx playwright install chromium

      - name: Run home smoke
        env:
          BASE_URL: ${{ inputs.target_url }}
          PLAYWRIGHT_BROWSERS_PATH: .playwright-cache
        run: npx playwright test
