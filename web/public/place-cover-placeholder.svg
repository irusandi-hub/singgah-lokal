<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="presentation" aria-hidden="true">
  <!--
    SINGGAH LOKAL — neutral card cover placeholder.
    PRESENTATION ONLY: this is a decorative local asset used when a Place has
    no canonical cover image. It is NOT a photo of any Place, is never stored
    on a Place record, and never stands in for canonical Place data.
    Motif: a workshop bench with a pot, a drying tray, and a folded textile —
    an abstract craft/production scene with no place-identifying detail.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ece0"/>
      <stop offset="1" stop-color="#e6dccb"/>
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a97e"/>
      <stop offset="1" stop-color="#a9865d"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9764a"/>
      <stop offset="1" stop-color="#9d5334"/>
    </linearGradient>
    <linearGradient id="wheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e6a45"/>
      <stop offset="1" stop-color="#6d5033"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#sky)"/>
  <circle cx="512" cy="86" r="54" fill="#efe2c8" opacity="0.75"/>

  <!-- back shelf -->
  <rect x="46" y="92" width="196" height="12" rx="6" fill="#d8c6a6"/>
  <rect x="72" y="58" width="32" height="34" rx="6" fill="#cfb68d"/>
  <rect x="116" y="70" width="26" height="22" rx="5" fill="#bfa274"/>
  <rect x="156" y="64" width="30" height="28" rx="5" fill="#d3bd97"/>

  <!-- bench -->
  <rect x="0" y="238" width="640" height="18" fill="url(#bench)"/>
  <rect x="0" y="256" width="640" height="144" fill="#dccbb0"/>

  <!-- potter wheel with a pot on it -->
  <rect x="60" y="196" width="188" height="14" rx="7" fill="#8b6a48"/>
  <rect x="76" y="210" width="16" height="30" fill="#7d5f40"/>
  <rect x="216" y="210" width="16" height="30" fill="#7d5f40"/>
  <circle cx="154" cy="196" r="34" fill="url(#wheel)"/>
  <circle cx="154" cy="196" r="22" fill="#a9855d"/>
  <path d="M132 178 q22 -12 44 0 l-5 34 q-17 10 -34 0 z" fill="url(#clay)"/>
  <rect x="128" y="172" width="52" height="9" rx="4" fill="#b3613a"/>

  <!-- drying tray with wares -->
  <ellipse cx="330" cy="222" rx="86" ry="16" fill="#c3a87e"/>
  <ellipse cx="330" cy="216" rx="86" ry="16" fill="#dcc49c"/>
  <rect x="292" y="188" width="26" height="28" rx="6" fill="#b9a173"/>
  <rect x="330" y="180" width="24" height="36" rx="6" fill="#c8b183"/>
  <rect x="366" y="190" width="22" height="26" rx="6" fill="#ae9668"/>

  <!-- soap / block stack -->
  <rect x="452" y="192" width="62" height="20" rx="6" fill="#e3d3ae"/>
  <rect x="458" y="172" width="58" height="20" rx="6" fill="#efe0bd"/>
  <rect x="464" y="152" width="52" height="20" rx="6" fill="#e7d6b0"/>

  <!-- folded textile -->
  <path d="M520 214 h84 a10 10 0 0 1 10 10 v14 a10 10 0 0 1 -10 10 h-84 a10 10 0 0 1 -10 -10 v-14 a10 10 0 0 1 10 -10 z" fill="#8fa39a"/>
  <path d="M526 226 h72 v6 h-72 z" fill="#7e948b" opacity="0.7"/>

  <!-- bench shadow -->
  <rect x="0" y="252" width="640" height="10" fill="#c9b694" opacity="0.5"/>
</svg>